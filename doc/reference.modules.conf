/*
 * modules.conf
 *
 * Configures automatic module loading and defines which modules may be loaded
 * or reloaded through the MODULE command.
 *
 * Syntax:
 *   loadmodule "module_name" [ : attribute [, attribute ...] ];
 *
 * Module names are case-sensitive; omit paths and the .so suffix.
 * Each module may be listed only once.
 *
 * Attributes:
 *   required  Must be active; can be reloaded but not unloaded.
 *             Failure to activate the module terminates the server.
 *   resident  Cannot be unloaded or reloaded while active.
 *             This attribute alone does not require successful activation.
 *
 * Attributes are optional and may be combined. Built-in module protection
 * remains effective regardless of configured attributes.
 *
 * Startup and REHASH CONF activate configured modules in declaration order,
 * keeping those already active. Removing an entry does not unload its module.
 */

/*
 * module_base_path: directory containing module files. Paths may be absolute
 * or relative to the server's working directory.
 */
